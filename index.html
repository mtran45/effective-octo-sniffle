<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Garden — Brainstorm a project</title>
  <style>
    :root { --ink:#17212b; --muted:#71808d; --line:#e4e9ed; --cream:#fbfaf7; --blue:#4263eb; --mint:#dff5e9; --peach:#ffe7d6; --lav:#e9e5ff; }
    * { box-sizing:border-box } body { margin:0; background:var(--cream); color:var(--ink); font:15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif }
    .shell { max-width:1180px; margin:auto; padding:34px 28px 60px }
    header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:38px }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase }
    h1 { font:700 clamp(32px,5vw,54px)/1.02 Georgia, serif; letter-spacing:-.04em; margin:8px 0 12px }
    .intro { color:var(--muted); max-width:490px; margin:0 }
    button { border:0; border-radius:10px; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer }
    .primary { background:var(--ink); color:white; box-shadow:0 3px 0 #0c1217 }
    .layout { display:grid; grid-template-columns:1fr 310px; gap:22px; align-items:start }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 8px 24px #28313b08 }
    .toolbar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); padding:11px 13px; font:inherit; outline:none }
    input:focus, textarea:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #4263eb18 }
    .search { flex:1; min-width:180px }
    .ideas { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px }
    .idea { border:1px solid var(--line); border-radius:14px; padding:17px; position:relative; min-height:145px; transition:.18s transform, .18s box-shadow }
    .idea:hover { transform:translateY(-2px); box-shadow:0 8px 20px #28313b12 }
    .idea h3 { margin:13px 0 6px; font-size:17px }
    .idea p { color:var(--muted); margin:0; font-size:14px }
    .tag { display:inline-block; padding:4px 9px; border-radius:99px; font-size:11px; font-weight:800; background:var(--mint) }
    .tag[data-kind="community"] { background:var(--peach) } .tag[data-kind="tool"] { background:var(--lav) }
    .remove { position:absolute; right:12px; top:10px; background:none; color:#9ca7b0; padding:3px 7px; font-size:18px }
    h2 { font-size:19px; margin:0 0 16px } .summary { display:flex; gap:10px; margin:0 0 20px }
    .stat { flex:1; background:#f5f7f8; border-radius:11px; padding:12px; text-align:center }
    .stat strong { display:block; font-size:24px } .stat small { color:var(--muted) }
    .brief textarea { min-height:100px; resize:vertical; margin-bottom:10px }
    .empty { color:var(--muted); text-align:center; padding:42px 10px; grid-column:1/-1 }
    .modal { display:none; position:fixed; inset:0; background:#17212b66; place-items:center; padding:20px; z-index:2 }
    .modal.open { display:grid } .modal .panel { max-width:500px; width:100% } label { display:block; color:var(--muted); font-size:12px; font-weight:700; margin:13px 0 6px }
    .actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px } .secondary { background:#f1f3f5; color:var(--ink) }
    @media(max-width:760px) { .layout { grid-template-columns:1fr } .ideas { grid-template-columns:1fr } header { gap:20px; flex-direction:column } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">Idea Garden · Untitled project</div><h1>What could we make?</h1><p class="intro">Collect sparks, find the thread, and shape your next project. No idea is too early.</p></div><button class="primary" id="add">＋ New idea</button></header>
    <div class="layout">
      <section class="panel"><div class="toolbar"><input class="search" id="search" placeholder="Search your ideas…" aria-label="Search ideas"><select id="filter" aria-label="Filter ideas"><option value="all">All ideas</option><option value="product">Product</option><option value="community">Community</option><option value="tool">Tool</option></select></div><div class="ideas" id="ideas"></div></section>
      <aside class="panel"><h2>Your project at a glance</h2><div class="summary"><div class="stat"><strong id="count">0</strong><small>ideas</small></div><div class="stat"><strong id="types">0</strong><small>directions</small></div></div><div class="brief"><label for="brief">Working brief</label><textarea id="brief" placeholder="What are you noticing? Who might this help?"></textarea><button class="primary" id="save">Save brief</button></div></aside>
    </div>
  </main>
  <div class="modal" id="modal"><form class="panel" id="form"><h2>Add an idea</h2><label for="title">A memorable name</label><input id="title" required placeholder="e.g. Neighbourhood skill swap"><label for="detail">What is it?</label><textarea id="detail" required placeholder="Describe the spark in a sentence or two…"></textarea><label for="kind">Direction</label><select id="kind"><option value="product">Product</option><option value="community">Community</option><option value="tool">Tool</option></select><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Add idea</button></div></form></div>
  <script>
    const seed=[{title:'A calmer way to plan',detail:'A weekly planning ritual that makes room for what matters, not just what is urgent.',kind:'product'},{title:'The five-minute club',detail:'Tiny, friendly challenges that help people build a creative habit together.',kind:'community'},{title:'Open-source project compass',detail:'A simple tool that turns a fuzzy idea into a clear first milestone.',kind:'tool'}];
    let ideas=JSON.parse(localStorage.getItem('ideas')||'null')||seed; const $=id=>document.getElementById(id);
    function render(){const query=$('search').value.toLowerCase(), kind=$('filter').value; const shown=ideas.filter(i=>(kind==='all'||i.kind===kind)&&(i.title+' '+i.detail).toLowerCase().includes(query)); $('ideas').innerHTML=shown.length?shown.map((i,n)=>`<article class="idea"><button class="remove" data-remove="${ideas.indexOf(i)}" aria-label="Remove idea">×</button><span class="tag" data-kind="${i.kind}">${i.kind}</span><h3>${esc(i.title)}</h3><p>${esc(i.detail)}</p></article>`).join(''):'<div class="empty">No ideas match that search. Try a new direction.</div>'; $('count').textContent=ideas.length; $('types').textContent=new Set(ideas.map(i=>i.kind)).size; localStorage.setItem('ideas',JSON.stringify(ideas)); document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{ideas.splice(+b.dataset.remove,1);render()})}
    function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    $('add').onclick=()=>{$('modal').classList.add('open');$('title').focus()}; $('cancel').onclick=()=>$('modal').classList.remove('open'); $('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')}; $('form').onsubmit=e=>{e.preventDefault();ideas.unshift({title:$('title').value,detail:$('detail').value,kind:$('kind').value});e.target.reset();$('modal').classList.remove('open');render()}; $('search').oninput=render;$('filter').onchange=render; $('brief').value=localStorage.getItem('brief')||''; $('save').onclick=()=>{localStorage.setItem('brief',$('brief').value);$('save').textContent='Saved ✓';setTimeout(()=>$('save').textContent='Save brief',1200)}; render();
  </script>
</body></html>
